# Local source of truth for the hosted YGF Supabase Auth settings that are
# safe to keep in version control. Provider credentials and CAPTCHA secrets
# remain dashboard-managed and must never be committed here.
project_id = "ygf-bowl-to-build"

[auth]
site_url = "https://malatangai.com"
additional_redirect_urls = [
  "https://malatangai.com/auth/callback",
]
enable_signup = true
enable_anonymous_sign_ins = true

# Preserve the hosted project's secure enrollment and email-verification
# defaults when applying the production URL and anonymous-session settings.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600
